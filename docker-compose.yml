# 启动前把 NS_PANEL_PASSWORD 和 VNC_PASSWORD 改成你自己的密码。
services:
  nodeseek-pm:
    build: .
    image: nodeseek-pm:0.7.9
    container_name: nodeseek-pm
    restart: unless-stopped
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp:unconfined
    environment:
      TZ: Asia/Shanghai
      NS_RUNTIME: docker
      NS_HOST: 0.0.0.0
      NS_PORT: "8787"
      NS_OPEN_BROWSER: "0"
      NS_PANEL_USER: admin
      NS_PANEL_PASSWORD: change-me
      VNC_PASSWORD: change12
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:6080:6080"
    volumes:
      - ./data:/app/data
      - ./browser-data:/browser-data

  # 面板容器自己挂了就发不出每日存活消息。这个服务在外面看 /health。
  # 整台机器关机时它也发不出。已有服务器要手写加一次，拉取代码不会改编排文件。
  nodeseek-watch:
    build: .
    image: nodeseek-pm:0.7.9
    container_name: nodeseek-watch
    restart: unless-stopped
    init: true
    depends_on:
      - nodeseek-pm
    environment:
      TZ: Asia/Shanghai
      NS_WATCH_URL: http://nodeseek-pm:8787/health
      NS_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    entrypoint: ["python", "-m", "ns_panel.watch"]
